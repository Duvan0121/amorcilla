<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti, mi amor 💖</title>
<style>
:root{--bg1:#1a0b1f;--bg2:#3b1233;--ink:#fff1f5;--soft:#f9c6d8;--pink:#ff4d8d;--gold:#ffd07a;--card:#2a1230;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg1:#fff0f5;--bg2:#ffd6e5;--ink:#4a1030;--soft:#8a3a62;--card:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#fff0f5;--bg2:#ffd6e5;--ink:#4a1030;--soft:#8a3a62;--card:#fff}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg1));background-size:300% 300%;animation:bg 16s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 100%}}
.heart{position:fixed;bottom:-40px;pointer-events:none;z-index:0;animation:rise linear forwards;opacity:.8}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
.burst{position:fixed;pointer-events:none;z-index:50;font-size:22px;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}
section{position:relative;z-index:1;padding:48px 16px;text-align:center}
.hero{min-height:0;padding:72px 16px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.hero + section{padding-top:20px}
.big{font-size:clamp(54px,16vw,96px);animation:beat 1.2s infinite;display:inline-block;filter:drop-shadow(0 0 24px var(--pink))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
h1{margin:0;font-size:clamp(28px,8vw,52px);font-weight:400;min-height:1.3em}
h1 .cur{border-right:2px solid var(--pink);animation:blink .7s infinite}
@keyframes blink{50%{border-color:transparent}}
.sub{color:var(--soft);font-style:italic;max-width:30em}
.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;width:100%;margin-top:10px}
.counter div{background:rgba(255,77,141,.15);border:1px solid rgba(255,77,141,.4);border-radius:14px;padding:10px 4px;backdrop-filter:blur(6px)}
.counter b{display:block;font-size:26px;color:var(--gold)}
.counter small{color:var(--soft);font-size:12px}
.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:11px 20px;background:linear-gradient(135deg,var(--pink),#ff8fb1);color:#fff;box-shadow:0 6px 20px rgba(255,77,141,.4);transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.04)}.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--pink);color:var(--ink);box-shadow:none}
.scroll{margin-top:18px;animation:bob 1.6s infinite;color:var(--soft)}
@keyframes bob{50%{transform:translateY(8px)}}
h2{font-weight:400;font-size:clamp(24px,6vw,38px);margin:0 0 6px}
.hint{color:var(--soft);font-size:14px;margin-bottom:20px}
.stage{position:relative;height:420px;perspective:1100px;max-width:900px;margin:0 auto;touch-action:pan-y}
.slot{position:absolute;left:50%;top:0;width:min(72vw,270px);height:390px;margin-left:calc(min(72vw,270px)/-2);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s;cursor:pointer}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.slot.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.85)}
.front{background:#000}
.front .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:90px;background-size:cover;background-position:center;transition:transform 1.2s}
.slot.active .front .ph{animation:kb 9s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12)}}
.front .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:14px}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--card),#4a1a45);color:#fff1f5;padding:22px 18px;display:flex;flex-direction:column;gap:10px;justify-content:center;text-align:left}
:root[data-theme="light"] .back{background:linear-gradient(160deg,#fff,#ffe0ec);color:#4a1030}
.back .row{font-size:14px;display:flex;gap:8px;align-items:flex-start}
.back .desc{font-style:italic;font-size:16px;line-height:1.5;border-left:3px solid var(--pink);padding-left:10px}
.back .edit{align-self:flex-end;font-size:12px;padding:6px 12px;margin-top:4px}
.nav{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--soft);opacity:.4;cursor:pointer;transition:.3s}
.dots i.on{background:var(--pink);opacity:1;transform:scale(1.5)}
.letter{max-width:560px;margin:0 auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,77,141,.35);border-radius:22px;padding:28px 22px;backdrop-filter:blur(8px);text-align:left;line-height:1.8;font-size:18px}
.reveal{opacity:0;transform:translateY(30px);transition:1s}.reveal.in{opacity:1;transform:none}
.reasons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:620px;margin:0 auto}
.chip{padding:10px 16px;border-radius:999px;background:rgba(255,77,141,.18);border:1px solid rgba(255,77,141,.45);cursor:pointer;transition:.3s;animation:float 4s ease-in-out infinite}
.chip:nth-child(2n){animation-delay:-1.3s}.chip:nth-child(3n){animation-delay:-2.4s}
.chip:hover{background:var(--pink);color:#fff;transform:scale(1.08)}
@keyframes float{50%{transform:translateY(-6px)}}
.tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:60;display:flex;gap:6px}
.tools button{width:38px;height:38px;border-radius:50%;border:1px solid var(--pink);background:rgba(0,0,0,.35);color:#fff;cursor:pointer;font-size:16px}
footer{padding:40px 16px;text-align:center;color:var(--soft);position:relative;z-index:1}
</style>
</head>
<body>
<div class="tools"><button id="theme" title="Tema">🌗</button><button id="cfg" title="Personalizar">✎</button></div>

<section class="hero">
  <div class="big" id="bigheart">❤️</div>
  <h1 id="title"><span id="typed"></span><span class="cur"></span></h1>
  <p class="sub" id="sub">Cada momento a tu lado es mi lugar favorito en el mundo.</p>
  <div class="counter" id="counter"></div>
  <small class="sub" id="since"></small>
  <button class="btn" id="love">Toca para sentir mi amor 💘</button>
  <div class="scroll">↓ nuestros recuerdos ↓</div>
</section>

<section>
  <h2>Nuestros recuerdos 📸</h2>
  <p class="hint">Desliza o usa las flechas · toca una foto para darle la vuelta</p>
  <div class="stage" id="stage"></div>
  <div class="dots" id="dots"></div>
  <div class="nav">
    <button class="btn ghost" id="prev">◀</button>
    <button class="btn" id="auto">⏸ Pausar</button>
    <button class="btn ghost" id="next">▶</button>
  </div>
</section>

<section>
  <h2>Razones por las que te amo 💞</h2>
  <p class="hint">Toca cada una</p>
  <div class="reasons" id="reasons"></div>
</section>

<section>
  <h2>Una carta para ti 💌</h2>
  <div class="letter reveal" id="letter"></div>
</section>

<footer>Hecho con todo mi corazón, para ti 💖<br><button class="btn" id="love2" style="margin-top:14px">Te amo ❤️</button></footer>

<script>
// ====== DATOS PERSONALIZABLES ======
var cfg={name:"Mi amor",from:"Tu pareja",start:"2026-03-27T20:00:00"};
var memories=[
 {e:"🌅",g:"#ff9a8b,#ff6a88",img:"images/foto1.jpg",place:"Nuestra primera cita",date:"28 de marzo",desc:"El día que supe que mi vida iba a cambiar para siempre."},
 {e:"🏖️",g:"#43cea2,#185a9d",img:"images/foto2.jpg",place:"Fuimos a rumbear",date:"04 de abril",desc:"Casi no la cuento pero estuviste conmigo."},
 {e:"🍕",g:"#f7971e,#ffd200",img:"images/foto3.jpg",place:"Fue tu cumpleaños",date:"25 de abril",desc:"Te volviste una asaltacunas"},
 {e:"🎡",g:"#a18cd1,#fbc2eb",img:"images/foto4.jpg",place:"Salidita casual",date:"17 de mayo",desc:"Fuimos a comprar las tangas que despues te quitaria"},
 {e:"🌃",g:"#355c7d,#c06c84",img:"images/foto5.jpg",place:"Fuimos al miniso",date:"08 de junio",desc:"Fuimos al miniso y despues a comer ramencito"},
 {e:"🌃",g:"#355c7d,#c06c84",img:"images/foto6.jpg",place:"Fuimos a las fiestas",date:"28 de junio",desc:"Fuimos a ver el desfile al centro"},
{e:"🌃",g:"#355c7d,#c06c84",img:"images/foto7.jpg",place:"Fuimos a convivir",date:"19 de septiembre",desc:"Ibamos a jugar y terminamos comiendo"}
];
var reasons=["Tu sonrisa 😊","Cómo me haces reír 😂","Tu forma de abrazarme 🤗","Tu paciencia conmigo 🕊️","Que eres mi hogar 🏡","Tu mirada 👀","Que eres mi mejor amigo/a 💫","Todo lo que eres ✨"];
var letter="Desde que llegaste, todo tiene más color. Gracias por cada abrazo, por cada risa y por quedarte incluso en los días difíciles. Eres mi persona favorita, mi calma y mi aventura. Prometo seguir eligiéndote cada día, hoy y siempre. Te amo, más de lo que las palabras pueden decir. 💖";

// ====== UTILIDADES ======
function $(i){return document.getElementById(i)}
var cols=["❤️","💖","💗","💕","💘","🌹","✨"];
function rise(){var h=document.createElement("span");h.className="heart";h.textContent=cols[Math.random()*cols.length|0];
 h.style.left=Math.random()*100+"vw";h.style.fontSize=(14+Math.random()*26)+"px";h.style.animationDuration=(6+Math.random()*7)+"s";
 document.body.appendChild(h);setTimeout(function(){h.remove()},13500)}
setInterval(rise,450);
function burst(x,y){for(var i=0;i<26;i++){var b=document.createElement("span");b.className="burst";b.textContent=cols[i%cols.length];
 var a=Math.random()*6.28,d=60+Math.random()*140;b.style.left=x+"px";b.style.top=y+"px";
 b.style.setProperty("--x",Math.cos(a)*d+"px");b.style.setProperty("--y",Math.sin(a)*d+"px");
 document.body.appendChild(b);setTimeout(function(b){return function(){b.remove()}}(b),950)}}
function loveClick(e){var r=e.currentTarget.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)}
$("love").onclick=loveClick;$("love2").onclick=loveClick;
$("bigheart").onclick=function(e){burst(e.clientX,e.clientY)};
document.addEventListener("pointerdown",function(e){if(e.target.closest(".slot,button"))return;burst(e.clientX,e.clientY)});

// ====== TÍTULO + CONTADOR ======
var typeTimer;
function typeTitle(){clearTimeout(typeTimer);var t="Para ti, "+cfg.name+" 💖",i=0,el=$("typed");el.textContent="";
 (function step(){el.textContent=t.slice(0,++i);if(i<t.length)typeTimer=setTimeout(step,90)})()}
function tick(){var st=cfg.start.length===10?cfg.start+"T00:00:00":cfg.start,s=new Date(st),n=new Date(),ms=n-s;
 if(isNaN(ms)||ms<0){$("counter").innerHTML="";return}
 var d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,sec=Math.floor(ms/1e3)%60;
 var y=Math.floor(d/365),rest=d%365;
 $("counter").innerHTML=[[y,"años"],[rest,"días"],[h,"horas"],[m,"minutos"],[sec,"segundos"],["∞","te amaré"]]
  .map(function(p){return"<div><b>"+p[0]+"</b><small>"+p[1]+"</small></div>"}).join("");
 $("since").textContent="Juntos desde el "+s.toLocaleDateString("es",{day:"numeric",month:"long",year:"numeric"})+" a las "+s.toLocaleTimeString("es",{hour:"numeric",minute:"2-digit",hour12:true})}
setInterval(tick,1000);

// ====== CARRUSEL ======
var cur=0,playing=true,timer;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function build(){var st=$("stage");st.innerHTML="";
 memories.forEach(function(m,i){var s=document.createElement("div");s.className="slot";s.dataset.i=i;
  var ph='<div class="ph" style="background:linear-gradient(135deg,'+m.g+')">'+m.e+'</div>';
  s.innerHTML='<div class="flip"><div class="face front">'+ph+'<div class="cap">📍 '+esc(m.place)+'</div></div>'+
   '<div class="face back"><div class="row">📍 <b>'+esc(m.place)+'</b></div><div class="row">📅 '+esc(m.date)+'</div>'+
   '<div class="desc">'+esc(m.desc);
  s.onclick=function(ev){if(ev.target.closest(".edit")){editMem(i);return}
   if(i!==cur){go(i);return}
   s.classList.toggle("flipped");if(s.classList.contains("flipped")){var r=s.getBoundingClientRect();burst(r.left+r.width/2,r.top+60)}};
  if(m.img){var im=new Image(),box=s.querySelector(".ph");
   im.onload=function(){box.style.background="url('"+m.img+"') center/cover no-repeat";box.textContent=""};
   im.src=m.img}
  st.appendChild(s)});
 $("dots").innerHTML=memories.map(function(_,i){return'<i data-i="'+i+'"></i>'}).join("");
 [].forEach.call($("dots").children,function(d){d.onclick=function(){go(+d.dataset.i)}});
 layout()}
function layout(){var n=memories.length;
 [].forEach.call($("stage").children,function(s,i){var o=i-cur;if(o>n/2)o-=n;if(o<-n/2)o+=n;var a=Math.abs(o);
  s.classList.toggle("active",o===0);if(o!==0)s.classList.remove("flipped");
  s.style.transform="translateX("+(o*62)+"%) translateZ("+(-a*140)+"px) rotateY("+(-o*32)+"deg)";
  s.style.opacity=a>2?0:1-a*.28;s.style.zIndex=10-a;s.style.pointerEvents=a>2?"none":"auto"});
 [].forEach.call($("dots").children,function(d,i){d.classList.toggle("on",i===cur)})}
function go(i){var n=memories.length;cur=(i+n)%n;layout()}
function editMem(i){var m=memories[i];
 var p=prompt("Lugar:",m.place);if(p!==null)m.place=p;
 var d=prompt("Fecha:",m.date);if(d!==null)m.date=d;
 var t=prompt("Descripción:",m.desc);if(t!==null)m.desc=t;build()}
$("next").onclick=function(){go(cur+1)};$("prev").onclick=function(){go(cur-1)};
$("auto").onclick=function(){playing=!playing;this.textContent=playing?"⏸ Pausar":"▶ Reanudar"};
setInterval(function(){if(playing&&!document.querySelector(".slot.flipped"))go(cur+1)},3800);
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
var sx=null;$("stage").addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
$("stage").addEventListener("touchend",function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));sx=null});

// ====== RAZONES / CARTA ======
$("reasons").innerHTML=reasons.map(function(r){return'<span class="chip">'+r+'</span>'}).join("");
[].forEach.call($("reasons").children,function(c){c.onclick=function(e){burst(e.clientX,e.clientY)}});
function typeLetter(){var el=$("letter"),i=0;el.textContent="";(function s(){el.textContent=letter.slice(0,i+=2);if(i<letter.length)setTimeout(s,35)})()}
var done=false;
new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");if(!done){done=true;typeLetter()}}})},{threshold:.3}).observe($("letter"));

// ====== AJUSTES ======
$("cfg").onclick=function(){
 var n=prompt("Nombre de tu pareja:",cfg.name);if(n)cfg.name=n;
 var d=prompt("Fecha y hora en que comenzó su historia (AAAA-MM-DDTHH:MM:SS):",cfg.start);if(d)cfg.start=d;
 var l=prompt("Tu carta de amor (déjala igual para conservarla):",letter);if(l){letter=l;done=false;typeLetter();done=true}
 typeTitle();tick()};
$("theme").onclick=function(){var r=document.documentElement,light=r.dataset.theme==="light"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:light)").matches);r.dataset.theme=light?"dark":"light"};

build();typeTitle();tick();
for(var k=0;k<10;k++)setTimeout(rise,k*200);
</script>
</body>
</html>
